<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle de Compras</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #e3e6ea;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    font-size: 15px; line-height: 1.5;
  }

  header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
  }
  .header-inner {
    max-width: 980px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 10px;
  }
  .top-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: -.01em; }
  .meta { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 10px; }
  .btn-ghost {
    background: transparent; border: 1px solid var(--border);
    padding: 6px 10px; border-radius: 8px; font-size: 12px;
    color: var(--muted); cursor: pointer;
  }
  .btn-ghost:hover { background: #f3f4f6; color: var(--text); }

  .search-wrap { position: relative; }
  .search-wrap input {
    width: 100%; padding: 12px 40px 12px 14px;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--card); font-size: 15px; color: var(--text);
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .search-wrap input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37,99,235,.12);
  }
  .search-wrap .clear {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    border: none; background: transparent; cursor: pointer;
    font-size: 18px; color: var(--muted); display: none;
  }
  .search-wrap input:not(:placeholder-shown) ~ .clear { display: block; }

  main { max-width: 980px; margin: 0 auto; padding: 18px 20px 60px; }
  .hint { font-size: 12px; color: var(--muted); margin-bottom: 12px; }

  .lista { display: flex; flex-direction: column; gap: 8px; }
  .item {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px;
    cursor: pointer; transition: border-color .15s, box-shadow .15s;
    display: flex; justify-content: space-between; align-items: center; gap: 14px;
  }
  .item:hover { border-color: #c7cdd6; box-shadow: var(--shadow); }
  .item .info { min-width: 0; }
  .item .cod {
    font-size: 11px; color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin-bottom: 2px;
  }
  .item .nome {
    font-weight: 500; font-size: 14px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 620px;
  }
  .item .forn { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .item .preco { text-align: right; white-space: nowrap; }
  .item .preco .val { font-weight: 600; font-size: 15px; }
  .item .preco .lbl {
    font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em;
  }

  .empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; }
  .loading { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; }
  .loading::after {
    content: ''; display: inline-block; width: 16px; height: 16px;
    margin-left: 8px; vertical-align: -2px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,.45);
    display: none; z-index: 50; padding: 20px; overflow-y: auto;
  }
  .overlay.active { display: flex; align-items: flex-start; justify-content: center; }
  .card {
    background: var(--card); border-radius: 14px;
    width: 100%; max-width: 620px; margin: 40px auto;
    box-shadow: 0 20px 40px rgba(0,0,0,.18); overflow: hidden;
  }
  .card-head {
    padding: 18px 20px 16px; border-bottom: 1px solid var(--border); position: relative;
  }
  .card-head .cod {
    font-size: 12px; color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .card-head h2 {
    font-size: 17px; margin: 4px 0 0; font-weight: 600; line-height: 1.35; padding-right: 30px;
  }
  .close {
    position: absolute; top: 14px; right: 14px;
    border: none; background: transparent; cursor: pointer;
    font-size: 22px; color: var(--muted); line-height: 1;
  }
  .close:hover { color: var(--text); }

  .card-body { padding: 18px 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
  .grid .cell {
    background: #fafbfc; border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px;
  }
  .grid .cell .lbl {
    font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .04em; margin-bottom: 3px;
  }
  .grid .cell .val { font-size: 15px; font-weight: 600; }
  .grid .cell .val.big { font-size: 18px; color: var(--accent); }

  .secao-titulo {
    font-size: 12px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .05em; margin: 0 0 8px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { font-size: 11px; color: var(--muted); font-weight: 500; text-transform: uppercase; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }

  .card-foot {
    padding: 14px 20px 18px; border-top: 1px solid var(--border);
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .btn {
    border: none; border-radius: 10px; padding: 10px 16px;
    font-size: 14px; font-weight: 500; cursor: pointer;
    transition: background .15s, transform .05s;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-secondary { background: var(--accent-soft); color: var(--accent); }
  .btn-secondary:hover { background: #dbeafe; }

  .toast {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #111827; color: #fff; padding: 10px 18px; border-radius: 10px;
    font-size: 13px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr; }
    .item .nome { max-width: 180px; }
    .item .preco .val { font-size: 14px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="top-row">
      <h1>Controle de Compras</h1>
      <div class="meta">
        <span id="totalInfo">—</span>
        <button class="btn-ghost" id="btnReload">Atualizar</button>
      </div>
    </div>
    <div class="search-wrap">
      <input id="busca" type="text" placeholder="Buscar por código ou nome do produto..." autocomplete="off" autofocus>
      <button class="clear" id="btnClear" title="Limpar">×</button>
    </div>
  </div>
</header>

<main>
  <div class="hint" id="hint">Carregando produtos...</div>
  <div class="lista" id="lista"></div>
</main>

<div class="overlay" id="overlay">
  <div class="card" id="card"></div>
</div>

<div class="toast" id="toast">Copiado!</div>

<script>
/* =========================================================
   ⚠️ COLE AQUI A URL DO SEU APPS SCRIPT
   ========================================================= */
var API_URL = 'https://script.google.com/macros/s/AKfycbxbI-dHmAI8HBcX9h6-L4A6qFcs5YWggzWmTZzLxDtWcdeWKT2bpUBTRMxTpPYobZg1/exec';

/* =========================================================
   Estado
   ========================================================= */
var PRODUTOS = [];
var FILTRADOS = [];
var LIMITE_LISTA = 80;
var CARREGADO = false;

var $ = function (id) { return document.getElementById(id); };

/* =========================================================
   Carregamento via fetch
   ========================================================= */
function carregar() {
  $('hint').innerHTML = 'Carregando produtos...';
  $('lista').innerHTML = '<div class="loading"></div>';
  $('totalInfo').textContent = '—';

  fetch(API_URL + '?action=data&t=' + Date.now())
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (resp) {
      if (!resp || !resp.ok) {
        throw new Error(resp && resp.erro ? resp.erro : 'Resposta inválida');
      }
      PRODUTOS = resp.produtos || [];
      CARREGADO = true;
      $('totalInfo').textContent = PRODUTOS.length + ' produtos';
      renderizar();
    })
    .catch(function (err) {
      $('hint').textContent = 'Erro ao carregar: ' + err.message;
      $('lista').innerHTML = '<div class="empty">Não foi possível carregar os dados.</div>';
    });
}

/* =========================================================
   Busca
   ========================================================= */
function normalizar(txt) {
  return String(txt || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .trim();
}

function aplicarFiltro() {
  var termo = normalizar($('busca').value);

  if (!termo) {
    FILTRADOS = PRODUTOS;
  } else {
    FILTRADOS = PRODUTOS.filter(function (p) {
      return normalizar(p.codigo).indexOf(termo) > -1 ||
             normalizar(p.nome).indexOf(termo) > -1 ||
             normalizar(p.produtoCompleto).indexOf(termo) > -1;
    });
  }
  renderizar();
}

/* =========================================================
   Render
   ========================================================= */
function formatBRL(v) {
  if (v == null || isNaN(v)) return '—';
  return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function escapar(txt) {
  return String(txt == null ? '' : txt)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function renderizar() {
  var lista = $('lista');
  var hint  = $('hint');

  if (!CARREGADO) return;

  if (!FILTRADOS.length) {
    hint.textContent = '';
    lista.innerHTML = '<div class="empty">Nenhum produto encontrado.</div>';
    return;
  }

  var mostrar = FILTRADOS.slice(0, LIMITE_LISTA);
  hint.textContent = FILTRADOS.length > LIMITE_LISTA
    ? 'Mostrando ' + LIMITE_LISTA + ' de ' + FILTRADOS.length + ' produtos. Refine a busca.'
    : FILTRADOS.length + ' produto' + (FILTRADOS.length > 1 ? 's' : '') + ' encontrado' + (FILTRADOS.length > 1 ? 's' : '') + '.';

  var html = '';
  mostrar.forEach(function (p, idx) {
    html +=
      '<div class="item" data-idx="' + idx + '">' +
        '<div class="info">' +
          '<div class="cod">' + escapar(p.codigo) + '</div>' +
          '<div class="nome">' + escapar(p.nome) + '</div>' +
          '<div class="forn">' + escapar(p.fornecedorAtual || '—') + '</div>' +
        '</div>' +
        '<div class="preco">' +
          '<div class="lbl">Custo médio</div>' +
          '<div class="val">' + formatBRL(p.custoMedio5) + '</div>' +
        '</div>' +
      '</div>';
  });
  lista.innerHTML = html;

  Array.prototype.forEach.call(lista.querySelectorAll('.item'), function (el) {
    el.addEventListener('click', function () {
      var i = Number(el.getAttribute('data-idx'));
      abrirDetalhe(mostrar[i]);
    });
  });
}

/* =========================================================
   Detalhe
   ========================================================= */
function abrirDetalhe(p) {
  var linhas = p.ultimas5.map(function (c, i) {
    return '<tr>' +
      '<td>' + (i + 1) + '</td>' +
      '<td>' + escapar(c.data) + '</td>' +
      '<td>' + escapar(c.fornecedor || '—') + '</td>' +
      '<td class="num">' + formatBRL(c.custoUnitario) + '</td>' +
      '<td class="num">' + (c.quantidade || 0) + '</td>' +
    '</tr>';
  }).join('');

  $('card').innerHTML =
    '<div class="card-head">' +
      '<button class="close" id="btnFechar">×</button>' +
      '<div class="cod">' + escapar(p.codigo) + '</div>' +
      '<h2>' + escapar(p.nome) + '</h2>' +
    '</div>' +
    '<div class="card-body">' +
      '<div class="grid">' +
        '<div class="cell"><div class="lbl">Fornecedor</div><div class="val">' + escapar(p.fornecedorAtual || '—') + '</div></div>' +
        '<div class="cell"><div class="lbl">Custo médio (últ. 5)</div><div class="val big">' + formatBRL(p.custoMedio5) + '</div></div>' +
        '<div class="cell"><div class="lbl">Última compra</div><div class="val">' + escapar(p.ultimaCompra || '—') + '</div></div>' +
        '<div class="cell"><div class="lbl">Compras registradas</div><div class="val">' + (p.totalCompras || 0) + '</div></div>' +
      '</div>' +
      '<p class="secao-titulo">Últimas 5 compras</p>' +
      '<table>' +
        '<thead><tr><th>#</th><th>Data</th><th>Fornecedor</th><th class="num">Custo un.</th><th class="num">Qtd</th></tr></thead>' +
        '<tbody>' + linhas + '</tbody>' +
      '</table>' +
    '</div>' +
    '<div class="card-foot">' +
      '<button class="btn btn-primary" id="btnCopiar">Copiar template</button>' +
      '<button class="btn btn-secondary" id="btnCopiarSimples">Copiar só o essencial</button>' +
    '</div>';

  $('overlay').classList.add('active');

  $('btnFechar').addEventListener('click', fecharDetalhe);
  $('btnCopiar').addEventListener('click', function () { copiar(gerarTemplate(p)); });
  $('btnCopiarSimples').addEventListener('click', function () { copiar(gerarTemplateSimples(p)); });
}

function fecharDetalhe() {
  $('overlay').classList.remove('active');
}

/* =========================================================
   Templates
   ========================================================= */
function gerarTemplate(p) {
  var linhas = p.ultimas5.map(function (c, i) {
    return (i + 1) + '. ' + c.data +
      ' | ' + (c.fornecedor || '—') +
      ' | ' + formatBRL(c.custoUnitario) +
      ' | Qtd: ' + (c.quantidade || 0);
  }).join('\n');

  return '📦 PRODUTO\n' +
    'Código: ' + p.codigo + '\n' +
    'Nome: ' + p.nome + '\n' +
    'Fornecedor: ' + (p.fornecedorAtual || '—') + '\n' +
    'Custo médio (últimas 5 compras): ' + formatBRL(p.custoMedio5) + '\n' +
    'Última compra: ' + (p.ultimaCompra || '—') + '\n' +
    'Total de compras registradas: ' + (p.totalCompras || 0) + '\n\n' +
    'Últimas 5 compras:\n' + linhas;
}

function gerarTemplateSimples(p) {
  return p.codigo + ' - ' + p.nome + '\n' +
    'Fornecedor: ' + (p.fornecedorAtual || '—') + '\n' +
    'Custo médio: ' + formatBRL(p.custoMedio5);
}

function copiar(texto) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(texto)
      .then(function () { mostrarToast('Copiado!'); })
      .catch(function () { copiarFallback(texto); });
  } else {
    copiarFallback(texto);
  }
}

function copiarFallback(texto) {
  var ta = document.createElement('textarea');
  ta.value = texto;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); mostrarToast('Copiado!'); }
  catch (e) { mostrarToast('Não foi possível copiar'); }
  document.body.removeChild(ta);
}

var toastTimer = null;
function mostrarToast(msg) {
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1800);
}

/* =========================================================
   Eventos
   ========================================================= */
document.addEventListener('DOMContentLoaded', function () {
  $('busca').addEventListener('input', aplicarFiltro);
  $('btnClear').addEventListener('click', function () {
    $('busca').value = '';
    aplicarFiltro();
    $('busca').focus();
  });
  $('btnReload').addEventListener('click', carregar);
  $('overlay').addEventListener('click', function (e) {
    if (e.target === $('overlay')) fecharDetalhe();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') fecharDetalhe();
  });

  carregar();
});
</script>
</body>
</html>
